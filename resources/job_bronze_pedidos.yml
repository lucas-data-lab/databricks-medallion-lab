resources:
  jobs:
    job_bronze_pedidos:
      name: job_pedidos_medalhao
      schedule:
        quartz_cron_expression: "0 0 6,17 * * ?"
        timezone_id: America/Sao_Paulo
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: bronze_pedidos
          notebook_task:
            notebook_path: ../src/bronze/nb_bronze_pedidos.py

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_pedidos
          notebook_task:
            notebook_path: ../src/silver/nb_silver_pedidos.py

        - task_key: gold_pedidos_diario
          depends_on:
            - task_key: silver_pedidos
          notebook_task:
            notebook_path: ../src/gold/nb_gold_pedidos_diario.py